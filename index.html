<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photoframe Generator Instansi</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00684a">
  <meta name="application-name" content="Photoframe">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photoframe">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .swatch { width:34px; height:34px; border-radius:9999px; border:2px solid #fff; box-shadow:0 0 0 1px #cbd5e1; cursor:pointer; transition:transform .1s; }
    .swatch:hover { transform:scale(1.08); }
    .swatch.active { box-shadow:0 0 0 3px #0f172a; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- Header App -->
  <header class="bg-emerald-700 text-white shadow-md mb-6 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="camera" class="w-6 h-6"></i>
        <h1 class="text-xl font-bold tracking-wide">Photoframe App</h1>
      </div>
      <button id="btnSettings" class="p-2 hover:bg-emerald-600 rounded-full transition-colors relative" title="Pengaturan Instansi">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Form Controls -->
    <div class="md:col-span-5 space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-800">
          <i data-lucide="sliders" class="w-5 h-5"></i> Input Data Foto
        </h2>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700">Mode Layout Foto</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnModeLandscape" onclick="setFotoMode('landscape')" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-emerald-600 bg-emerald-50 text-emerald-700">
              <i data-lucide="image" class="w-4 h-4"></i> Landscape (1)
            </button>
            <button type="button" id="btnModePortrait" onclick="setFotoMode('portrait')" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-slate-300 text-slate-600 hover:bg-slate-50">
              <i data-lucide="columns" class="w-4 h-4"></i> Portrait (Max 2)
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700" id="labelUpload">Upload Foto (Landscape)</label>
          <input type="file" id="inputFoto" accept="image/*" multiple onchange="handleFotoUpload(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border rounded-lg" />
          <p class="text-xs text-slate-400 mt-1" id="uploadHint">Pilih 1 foto format landscape</p>
        </div>

        <!-- Tampilan foto: utuh / isi penuh (crop) -->
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700">Tampilan Foto</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnFitContain" onclick="setPhotoFit('contain')" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-emerald-600 bg-emerald-50 text-emerald-700">
              <i data-lucide="minimize" class="w-4 h-4"></i> Utuh
            </button>
            <button type="button" id="btnFitCover" onclick="setPhotoFit('cover')" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-slate-300 text-slate-600 hover:bg-slate-50">
              <i data-lucide="crop" class="w-4 h-4"></i> Isi penuh (crop)
            </button>
          </div>
          <p class="text-xs text-slate-400 mt-1" id="fitHint">Foto tampil utuh, sisa ruang diisi warna latar</p>
          <div id="focusPanel" class="hidden mt-3 p-3 border rounded-lg bg-slate-50 space-y-3"></div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Tanggal</label>
            <input type="date" id="inputTanggal" onchange="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Waktu / Jam</label>
            <input type="time" id="inputJam" onchange="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700">Lokasi</label>
          <input type="text" id="inputLokasi" placeholder="Contoh: Lobby Bagian Organisasi" oninput="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700">Keterangan / Uraian</label>
          <textarea id="inputKeterangan" rows="3" placeholder="Contoh: Apel Pagi arahan pimpinan..." oninput="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <!-- Ukuran font caption -->
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1 text-slate-700">Ukuran Font Caption</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <span class="block text-xs text-slate-500 mb-1">Pelapor</span>
              <select id="fsPelapor" onchange="onFontSizeChange()" class="w-full border rounded-lg px-2 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none"><option value="12">Kecil</option><option value="14" selected>Normal</option><option value="16">Sedang</option><option value="18">Besar</option><option value="20">Sangat besar</option></select>
            </div>
            <div>
              <span class="block text-xs text-slate-500 mb-1">Lokasi</span>
              <select id="fsLokasi" onchange="onFontSizeChange()" class="w-full border rounded-lg px-2 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none"><option value="12">Kecil</option><option value="14" selected>Normal</option><option value="16">Sedang</option><option value="18">Besar</option><option value="20">Sangat besar</option></select>
            </div>
            <div>
              <span class="block text-xs text-slate-500 mb-1">Keterangan</span>
              <select id="fsKeterangan" onchange="onFontSizeChange()" class="w-full border rounded-lg px-2 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none"><option value="12">Kecil</option><option value="14" selected>Normal</option><option value="16">Sedang</option><option value="18">Besar</option><option value="20">Sangat besar</option></select>
            </div>
          </div>
        </div>

        <button type="button" id="btnDownload" onclick="downloadImage(this)" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-base">
          <i data-lucide="download" class="w-5 h-5"></i> Download Photoframe (PNG)
        </button>
      </div>
    </div>

    <!-- Preview (canvas yang sama persis dengan hasil download) -->
    <div class="md:col-span-7 flex flex-col items-center">
      <div class="w-full bg-slate-800 p-2 rounded-t-xl text-white text-xs font-semibold flex justify-between items-center px-4">
        <span>PREVIEW HASIL</span>
        <span class="text-slate-400">Siap Ekspor HD</span>
      </div>
      <div class="w-full bg-white shadow-xl border border-slate-200" style="max-width:650px;">
        <canvas id="frameCanvas" style="display:block;width:100%;height:auto"></canvas>
      </div>
    </div>

  </main>

  <!-- Modal Settings -->
  <div id="modalSettings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative max-h-[92vh] overflow-y-auto">
      <button type="button" onclick="cancelSettings()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>

      <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i data-lucide="settings" class="w-5 h-5 text-emerald-700"></i> Pengaturan Identitas
      </h3>

      <form id="formSettings" onsubmit="saveSettings(event)" class="space-y-4">

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">Nama Kantor / Instansi (H1)</label>
          <input type="text" id="settingH1" required placeholder="Contoh: Sekretariat Daerah Indragiri Hulu" oninput="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">Nama Bidang / Sub Unit (H2)</label>
          <input type="text" id="settingH2" required placeholder="Contoh: Bagian Organisasi" oninput="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">Nama / Jabatan Pelapor Default</label>
          <input type="text" id="settingPelapor" required placeholder="Contoh: Kepala Bagian Organisasi" oninput="requestRender()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <!-- Warna latar belakang -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700">Warna Latar Belakang (Topbar &amp; Tanggal/Jam)</label>
          <div id="swatchRow" class="flex flex-wrap items-center gap-2"></div>
          <div class="flex items-center gap-2 mt-3">
            <input type="color" id="settingColorCustom" class="w-10 h-9 p-0 border rounded cursor-pointer" />
            <span class="text-xs text-slate-500">Pilih warna sendiri · warna tulisan menyesuaikan otomatis</span>
          </div>
        </div>

        <!-- Latar area foto -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-slate-700">Latar Area Foto (ruang kosong di sekitar foto)</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 border rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-slate-50">
              <input type="radio" name="fotoBg" value="theme" checked onchange="onFotoBgChange(this.value)"> Ikut warna tema
            </label>
            <label class="flex items-center gap-2 border rounded-lg px-3 py-2 text-sm cursor-pointer hover:bg-slate-50">
              <input type="radio" name="fotoBg" value="white" onchange="onFotoBgChange(this.value)"> Putih
            </label>
          </div>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="cancelSettings()" class="px-4 py-2 rounded-lg border text-sm font-semibold text-slate-600 hover:bg-slate-50">Batal</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold shadow">Simpan Pengaturan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ================= CORE: menggambar photoframe ke canvas =================
    // (Dipakai oleh preview DAN download, jadi hasilnya selalu identik.
    //  Tidak memakai html2canvas lagi -> posisi teks/ikon dihitung langsung.)
    // ==== CORE START
    const W = 650;                       // lebar frame (satuan desain)
    const FOTO_H = W * 0.75;             // area foto selalu 4:3 (tinggi = foto landscape)
    const BAR_H = 68;                    // tinggi minimum topbar = tinggi banner tanggal/jam
    const FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";

    const ICONS = {
      'calendar': '<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>',
      'clock': '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      'user': '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      'map-pin': '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
      'file-text': '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
      'image-plus': '<path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/>'
    };

    const iconCache = new Map();
    function loadIcon(name, color) {
      const key = name + '|' + color;
      if (iconCache.has(key)) return iconCache.get(key);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
      const p = new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      });
      iconCache.set(key, p);
      return p;
    }

    // ---- warna ----
    function hexToRgb(hex) {
      let h = hex.replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
    }
    function mixHex(a, b, t) { // t=0 -> a, t=1 -> b
      const A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
    }
    function luminance(hex) {
      const [r, g, b] = hexToRgb(hex).map(v => {
        v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function themeFrom(hex) {
      const light = luminance(hex) > 0.4; // latar terang -> tulisan gelap
      const fg = light ? '#111827' : '#ffffff';
      return {
        bg: hex,
        fg,
        sub: light ? mixHex(hex, '#000000', 0.45) : mixHex(hex, '#ffffff', 0.8),
        line: light ? mixHex(hex, '#000000', 0.3) : mixHex(hex, '#ffffff', 0.35),
        accent: light ? '#334155' : hex
      };
    }

    // ---- teks ----
    function wrapText(ctx, text, maxW) {
      const out = [];
      String(text).split('\n').forEach(par => {
        const words = par.split(/\s+/).filter(Boolean);
        if (!words.length) { out.push(''); return; }
        let line = '';
        for (let w of words) {
          while (ctx.measureText(w).width > maxW) { // kata terlalu panjang -> potong
            let n = w.length;
            while (n > 1 && ctx.measureText(w.slice(0, n)).width > maxW) n--;
            if (line) { out.push(line); line = ''; }
            out.push(w.slice(0, n));
            w = w.slice(n);
          }
          const t = line ? line + ' ' + w : w;
          if (ctx.measureText(t).width <= maxW) line = t;
          else { out.push(line); line = w; }
        }
        if (line) out.push(line);
      });
      return out;
    }

    // Gambar teks dengan titik tengah vertikal = cy (supaya sejajar dengan ikon)
    function drawTextAt(ctx, str, x, cy, weight, size, color, align) {
      ctx.font = `${weight} ${size}px ${FONT}`;
      ctx.fillStyle = color;
      ctx.textAlign = align || 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(str, x, cy + size * 0.36); // 0.36em ≈ setengah tinggi huruf kapital
    }

    function setFont(ctx, weight, size) { ctx.font = `${weight} ${size}px ${FONT}`; }

    // ---- hitung layout ----
    const LOGO_H = 50;
    function measure(ctx, S) {
      const L = {};
      L.logoW = LOGO_H * (S.logo.naturalWidth / S.logo.naturalHeight);
      L.tx = 20 + L.logoW + 14;
      const tw = W - 20 - L.tx;
      setFont(ctx, 700, 17); L.h1 = wrapText(ctx, S.h1 || '', tw);
      setFont(ctx, 500, 13); L.h2 = wrapText(ctx, S.h2 || '', tw);
      L.textH = L.h1.length * 22 + (L.h2.length ? 2 + L.h2.length * 18 : 0);
      L.topH = Math.max(BAR_H, Math.ceil(L.textH + 20));
      L.fotoY = L.topH;
      L.bannerY = L.fotoY + FOTO_H;
      L.capY = L.bannerY + BAR_H;

      const fs = S.fontSizes || {};
      L.rows = [
        { icon: 'user', label: 'Pelapor', val: S.pelapor || '-', bold: true, size: fs.pelapor || 14 },
        { icon: 'map-pin', label: 'Lokasi', val: S.lokasi || '-', bold: true, size: fs.lokasi || 14 },
        { icon: 'file-text', label: 'Keterangan', val: S.keterangan || '-', bold: false, size: fs.keterangan || 14 }
      ];
      // Lebar kolom label menyesuaikan font terbesar, supaya titik dua & isi tetap sejajar di ketiga baris
      let labelCol = 116;
      L.rows.forEach(r => {
        r.lh = Math.round(r.size * 1.55);       // tinggi baris
        r.iconPx = Math.round(r.size * 1.15);   // ukuran ikon ikut membesar
        r.labelX = 20 + r.iconPx + 8;
        setFont(ctx, 700, r.size);
        labelCol = Math.max(labelCol, r.iconPx + 8 + Math.ceil(ctx.measureText(r.label).width) + 6);
      });
      L.colonX = 20 + labelCol + 14;
      L.valX = 20 + labelCol + 28;
      const vw = W - 20 - L.valX;
      let h = 20;
      L.rows.forEach((r, i) => {
        setFont(ctx, r.bold ? 600 : 400, r.size);
        r.lines = wrapText(ctx, r.val, vw);
        r.h = Math.max(r.lh, r.lines.length * r.lh);
        h += r.h + (i < L.rows.length - 1 ? 29 : 0);
      });
      h += 20;
      L.capH = h;
      L.H = Math.ceil(L.capY + L.capH);
      return L;
    }

    // ---- gambar ----
    function drawContain(ctx, img, x, y, w, h) {
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const r = Math.min(w / iw, h / ih);
      const dw = iw * r, dh = ih * r;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    }

    // Mode "isi penuh": foto menutupi seluruh sel (di-crop), fx/fy = fokus 0..1
    function coverInfo(img, cw, ch) {
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const r = Math.max(cw / iw, ch / ih);
      const dw = iw * r, dh = ih * r;
      return { dw, dh, ox: Math.max(0, dw - cw), oy: Math.max(0, dh - ch) };
    }
    function drawCover(ctx, img, x, y, w, h, fx, fy) {
      const c = coverInfo(img, w, h);
      ctx.drawImage(img, x - c.ox * fx, y - c.oy * fy, c.dw, c.dh);
    }
    function photoCells(n) {
      const gap = 4, cw = (W - gap) / 2;
      return n >= 2 ? [{ x: 0, w: cw }, { x: cw + gap, w: cw }] : [{ x: 0, w: W }];
    }

    function paint(ctx, S, L, ic) {
      const T = themeFrom(S.color);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // dasar putih
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, L.H);

      // ===== Topbar =====
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, W, L.topH);
      ctx.drawImage(S.logo, 20, (L.topH - LOGO_H) / 2, L.logoW, LOGO_H);
      let ty = (L.topH - L.textH) / 2;
      L.h1.forEach((ln, i) => drawTextAt(ctx, ln, L.tx, ty + i * 22 + 11, 700, 17, T.fg));
      const h2y = ty + L.h1.length * 22 + 2;
      L.h2.forEach((ln, i) => drawTextAt(ctx, ln, L.tx, h2y + i * 18 + 9, 500, 13, T.sub));

      // ===== Area foto (selalu 4:3) =====
      const fotoBg = S.fotoBg === 'white' ? '#ffffff' : T.bg;
      const gapCol = S.fotoBg === 'white' ? '#e2e8f0' : T.line;
      ctx.fillStyle = fotoBg;
      ctx.fillRect(0, L.fotoY, W, FOTO_H);
      const n = S.photos.length;
      if (n === 0) {
        const muted = S.fotoBg === 'white' ? '#94a3b8' : T.sub;
        if (ic.plus) ctx.drawImage(ic.plus, W / 2 - 24, L.fotoY + FOTO_H / 2 - 40, 48, 48);
        drawTextAt(ctx, 'Belum ada foto yang diunggah', W / 2, L.fotoY + FOTO_H / 2 + 28, 400, 14, muted, 'center');
      } else {
        const cells = photoCells(n);
        if (n >= 2) {
          ctx.fillStyle = gapCol;
          ctx.fillRect(cells[0].w, L.fotoY, 4, FOTO_H);
        }
        S.photos.slice(0, 2).forEach((img, i) => {
          const c = cells[i];
          ctx.save();
          ctx.beginPath(); ctx.rect(c.x, L.fotoY, c.w, FOTO_H); ctx.clip();
          if (S.photoFit === 'cover') {
            const f = (S.focus && S.focus[i]) || { x: 0.5, y: 0.5 };
            drawCover(ctx, img, c.x, L.fotoY, c.w, FOTO_H, f.x, f.y);
          } else {
            drawContain(ctx, img, c.x, L.fotoY, c.w, FOTO_H);
          }
          ctx.restore();
        });
      }

      // ===== Banner tanggal & jam =====
      const by = L.bannerY, mid = by + BAR_H / 2;
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, by, W, BAR_H);
      // kiri: ikon kalender + tanggal/hari (blok teks 40px, dipusatkan terhadap ikon)
      if (ic.cal) ctx.drawImage(ic.cal, 20, mid - 14, 28, 28);
      drawTextAt(ctx, S.tanggal, 60, mid - 8, 700, 18, T.fg);
      drawTextAt(ctx, S.hari, 60, mid + 12, 400, 12, T.sub);
      // tengah: pemisah
      ctx.fillStyle = T.line;
      ctx.globalAlpha = 0.6;
      ctx.fillRect(W / 2, mid - 16, 1, 32);
      ctx.globalAlpha = 1;
      // kanan: ikon jam + jam/zona (rata kanan)
      setFont(ctx, 800, 22); const wj = ctx.measureText(S.jam).width;
      setFont(ctx, 700, 11); const wz = ctx.measureText(S.zona).width;
      const gw = Math.max(wj, wz);
      if (ic.clock) ctx.drawImage(ic.clock, W - 20 - gw - 12 - 28, mid - 14, 28, 28);
      drawTextAt(ctx, S.jam, W - 20, mid - 8, 800, 22, T.fg, 'right');
      drawTextAt(ctx, S.zona, W - 20, mid + 12, 700, 11, T.sub, 'right');

      // ===== Caption =====
      let cy = L.capY + 20;
      L.rows.forEach((r, i) => {
        const c = cy + r.lh / 2; // titik tengah baris pertama
        const img = r.icon === 'user' ? ic.user : r.icon === 'map-pin' ? ic.pin : ic.doc;
        if (img) ctx.drawImage(img, 20, c - r.iconPx / 2, r.iconPx, r.iconPx);
        drawTextAt(ctx, r.label, r.labelX, c, 700, r.size, '#334155');
        drawTextAt(ctx, ':', L.colonX, c, 700, r.size, '#94a3b8', 'center');
        r.lines.forEach((ln, k) => drawTextAt(ctx, ln, L.valX, c + k * r.lh, r.bold ? 600 : 400, r.size, r.bold ? '#1e293b' : '#334155'));
        cy += r.h;
        if (i < L.rows.length - 1) {
          ctx.fillStyle = '#f1f5f9';
          ctx.fillRect(20, cy + 14, W - 40, 1);
          cy += 29;
        }
      });
    }

    async function loadIcons(S) {
      const T = themeFrom(S.color);
      const muted = S.fotoBg === 'white' ? '#94a3b8' : T.sub;
      const [cal, clock, user, pin, doc, plus] = await Promise.all([
        loadIcon('calendar', T.fg), loadIcon('clock', T.fg),
        loadIcon('user', T.accent), loadIcon('map-pin', T.accent), loadIcon('file-text', T.accent),
        loadIcon('image-plus', muted)
      ]);
      return { cal, clock, user, pin, doc, plus };
    }

    // Render penuh ke sebuah canvas pada skala tertentu
    async function drawFrame(canvas, S, scale, scratchCtx) {
      const ic = await loadIcons(S);
      const L = measure(scratchCtx, S);
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(L.H * scale);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      paint(ctx, S, L, ic);
      return L;
    }

    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    const $ = id => document.getElementById(id);

    function getAutoTimeZone() {
      const offset = new Date().getTimezoneOffset();
      if (offset === -420) return 'WIB';
      if (offset === -480) return 'WITA';
      if (offset === -540) return 'WIT';
      return 'WIB';
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return { tanggal: '-', hari: '-' };
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const hariArr = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const bulanArr = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return { tanggal: `${date.getDate()} ${bulanArr[date.getMonth()]} ${date.getFullYear()}`, hari: hariArr[date.getDay()] };
    }

    function getState() {
      const f = formatTanggalIndo($('inputTanggal').value);
      return {
        logo: logoImg,
        h1: $('settingH1').value.trim(),
        h2: $('settingH2').value.trim(),
        pelapor: $('settingPelapor').value.trim(),
        lokasi: $('inputLokasi').value.trim(),
        keterangan: $('inputKeterangan').value.trim(),
        tanggal: f.tanggal,
        hari: f.hari,
        jam: $('inputJam').value || '00:00',
        zona: getAutoTimeZone(),
        photos: uploadedImages,
        color: theme.color,
        fotoBg: theme.fotoBg,
        photoFit,
        focus,
        fontSizes
      };
    }

    async function ensureFonts() {
      try {
        if (document.fonts && document.fonts.load) {
          await Promise.all(['400 14px', '500 13px', '600 14px', '700 17px', '800 22px'].map(f => document.fonts.load(f + ' "Inter"')));
        }
      } catch (e) {}
    }

    // ---- render preview (anti balapan) ----
    let renderToken = 0;
    const scratchCtx = document.createElement('canvas').getContext('2d');
    async function requestRender() {
      const token = ++renderToken;
      await ensureFonts();
      if (token !== renderToken || !logoImg) return;
      const dpr = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
      const canvas = $('frameCanvas');
      const ic = await loadIcons(getState());
      if (token !== renderToken) return;
      const S = getState();
      const L = measure(scratchCtx, S);
      lastL = L;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(L.H * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paint(ctx, S, L, ic);
    }

    // ---- init ----
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      initDefaultDateTime();
      loadSettings();
      buildSwatches();
      $('btnSettings').addEventListener('click', openModalSettings);
      window.addEventListener('resize', () => {}); // canvas sudah responsif lewat CSS
      loadFontSizes();
      setupDrag();
      setPhotoFit(safeGet('pf_fit') === 'cover' ? 'cover' : 'contain', false);
      logoImg = await loadImage(LOGO_SRC);
      requestRender();
    });

    function initDefaultDateTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      $('inputTanggal').value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      $('inputJam').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    // ---- pengaturan ----
    function loadSettings() {
      $('settingH1').value = safeGet('pf_h1') || 'Sekretariat Daerah Indragiri Hulu';
      $('settingH2').value = safeGet('pf_h2') || 'Bagian Organisasi';
      $('settingPelapor').value = safeGet('pf_pelapor') || 'Kepala Bagian Organisasi';
      try { localStorage.removeItem('pf_logo'); } catch (e) {}
      const c = safeGet('pf_color');
      if (c && /^#[0-9a-fA-F]{6}$/.test(c)) theme.color = c;
      const fb = safeGet('pf_fotobg');
      if (fb === 'white' || fb === 'theme') theme.fotoBg = fb;
      savedTheme = { ...theme };
      syncThemeUI();
    }

    function buildSwatches() {
      const row = $('swatchRow');
      row.innerHTML = '';
      PRESETS.forEach(p => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'swatch';
        b.title = p.name;
        b.dataset.color = p.color;
        b.style.background = p.color;
        b.addEventListener('click', () => { theme.color = p.color; syncThemeUI(); requestRender(); });
        row.appendChild(b);
      });
      $('settingColorCustom').addEventListener('input', e => { theme.color = e.target.value; syncThemeUI(); requestRender(); });
      syncThemeUI();
    }

    function syncThemeUI() {
      document.querySelectorAll('#swatchRow .swatch').forEach(b => {
        b.classList.toggle('active', b.dataset.color.toLowerCase() === theme.color.toLowerCase());
      });
      const cc = $('settingColorCustom');
      if (cc) cc.value = theme.color;
      document.querySelectorAll('input[name="fotoBg"]').forEach(r => { r.checked = (r.value === theme.fotoBg); });
    }

    function onFotoBgChange(v) { theme.fotoBg = v; requestRender(); }

    function openModalSettings() { $('modalSettings').classList.remove('hidden'); }
    function closeModalSettings() { $('modalSettings').classList.add('hidden'); }

    function cancelSettings() {
      // kembalikan ke pengaturan tersimpan
      theme = { ...savedTheme };
      $('settingH1').value = safeGet('pf_h1') || 'Sekretariat Daerah Indragiri Hulu';
      $('settingH2').value = safeGet('pf_h2') || 'Bagian Organisasi';
      $('settingPelapor').value = safeGet('pf_pelapor') || 'Kepala Bagian Organisasi';
      syncThemeUI();
      requestRender();
      closeModalSettings();
    }

    function saveSettings(e) {
      e.preventDefault();
      safeSet('pf_h1', $('settingH1').value.trim());
      safeSet('pf_h2', $('settingH2').value.trim());
      safeSet('pf_pelapor', $('settingPelapor').value.trim());
      safeSet('pf_color', theme.color);
      safeSet('pf_fotobg', theme.fotoBg);
      savedTheme = { ...theme };
      requestRender();
      closeModalSettings();
    }

    // ---- mode foto & upload ----
    function setFotoMode(mode) {
      fotoMode = mode;
      const on = "py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-emerald-600 bg-emerald-50 text-emerald-700";
      const off = "py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-slate-300 text-slate-600 hover:bg-slate-50";
      if (mode === 'landscape') {
        $('btnModeLandscape').className = on; $('btnModePortrait').className = off;
        $('labelUpload').innerText = 'Upload Foto (Landscape)';
        $('uploadHint').innerText = 'Pilih 1 foto format landscape';
      } else {
        $('btnModePortrait').className = on; $('btnModeLandscape').className = off;
        $('labelUpload').innerText = 'Upload Foto (Portrait)';
        $('uploadHint').innerText = 'Pilih maksimal 2 foto format potret';
      }
      uploadedImages = [];
      focus = [];
      $('inputFoto').value = '';
      updateFocusPanel();
      requestRender();
    }

    function readImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = evt => loadImage(evt.target.result).then(resolve, reject);
        reader.readAsDataURL(file);
      });
    }

    async function handleFotoUpload(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const maxAllowed = fotoMode === 'landscape' ? 1 : 2;
      try {
        uploadedImages = await Promise.all(files.slice(0, maxAllowed).map(readImage));
      } catch (err) {
        console.error(err);
        alert('Foto gagal dibaca. Coba pilih foto lain.');
        uploadedImages = [];
      }
      focus = uploadedImages.map(() => ({ x: 0.5, y: 0.5 }));
      updateFocusPanel();
      requestRender();
    }

    // ---- ukuran font caption ----
    function loadFontSizes() {
      try {
        const saved = JSON.parse(safeGet('pf_fs') || '{}');
        ['pelapor', 'lokasi', 'keterangan'].forEach(k => {
          const v = Number(saved[k]);
          if ([12, 14, 16, 18, 20].includes(v)) fontSizes[k] = v;
        });
      } catch (e) {}
      $('fsPelapor').value = fontSizes.pelapor;
      $('fsLokasi').value = fontSizes.lokasi;
      $('fsKeterangan').value = fontSizes.keterangan;
    }

    function onFontSizeChange() {
      fontSizes = {
        pelapor: Number($('fsPelapor').value),
        lokasi: Number($('fsLokasi').value),
        keterangan: Number($('fsKeterangan').value)
      };
      safeSet('pf_fs', JSON.stringify(fontSizes));
      requestRender();
    }

    // ---- tampilan foto: utuh / crop + fokus ----
    const clamp01 = v => Math.max(0, Math.min(1, v));

    function setPhotoFit(mode, persist = true) {
      photoFit = mode;
      const on = "py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-emerald-600 bg-emerald-50 text-emerald-700";
      const off = "py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center gap-1 border-slate-300 text-slate-600 hover:bg-slate-50";
      $('btnFitContain').className = mode === 'contain' ? on : off;
      $('btnFitCover').className = mode === 'cover' ? on : off;
      $('fitHint').innerText = mode === 'cover'
        ? 'Foto memenuhi area (sebagian terpotong). Geser foto di preview atau pakai slider untuk memilih fokus.'
        : 'Foto tampil utuh, sisa ruang diisi warna latar';
      if (persist) safeSet('pf_fit', mode);
      updateFocusPanel();
      requestRender();
    }

    function cellOf(i) { return photoCells(uploadedImages.length)[i]; }

    function updateFocusPanel() {
      const panel = $('focusPanel');
      const canvas = $('frameCanvas');
      const active = photoFit === 'cover' && uploadedImages.length > 0;
      canvas.style.touchAction = active ? 'none' : 'auto';
      canvas.style.cursor = active ? 'grab' : 'default';
      if (!active) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
      panel.classList.remove('hidden');
      let html = '<div class="flex items-center justify-between"><span class="text-xs font-semibold text-slate-600">Fokus foto</span><button type="button" onclick="resetFocus()" class="text-xs font-semibold text-emerald-700 hover:underline">Reset ke tengah</button></div>';
      uploadedImages.forEach((img, i) => {
        const info = coverInfo(img, cellOf(i).w, FOTO_H);
        const canX = info.ox > 0.5, canY = info.oy > 0.5;
        const f = focus[i] || { x: 0.5, y: 0.5 };
        const row = (axis, label, can, val) => `
          <div class="flex items-center gap-2 text-xs ${can ? 'text-slate-600' : 'text-slate-300'}">
            <span class="w-24 shrink-0">${label}</span>
            <input type="range" id="f${axis}${i}" min="0" max="100" value="${Math.round(val * 100)}" ${can ? '' : 'disabled'}
              oninput="onFocusSlider(${i}, '${axis}', this.value)" class="flex-1 accent-emerald-700">
          </div>`;
        html += `<div class="space-y-1"><div class="text-xs font-bold text-slate-700">Foto ${i + 1}</div>
          ${row('x', 'Kiri ↔ Kanan', canX, f.x)}
          ${row('y', 'Atas ↕ Bawah', canY, f.y)}
          ${(!canX && !canY) ? '<div class="text-[11px] text-slate-400">Rasio foto sudah pas, tidak ada bagian yang terpotong.</div>' : ''}
        </div>`;
      });
      panel.innerHTML = html;
    }

    function syncFocusUI() {
      focus.forEach((f, i) => {
        const x = $('fx' + i), y = $('fy' + i);
        if (x) x.value = Math.round(f.x * 100);
        if (y) y.value = Math.round(f.y * 100);
      });
    }

    function onFocusSlider(i, axis, v) {
      if (!focus[i]) focus[i] = { x: 0.5, y: 0.5 };
      focus[i][axis] = clamp01(Number(v) / 100);
      requestRender();
    }

    function resetFocus() {
      focus = uploadedImages.map(() => ({ x: 0.5, y: 0.5 }));
      syncFocusUI();
      requestRender();
    }

    // Geser foto langsung di preview (mouse / sentuh)
    function setupDrag() {
      const canvas = $('frameCanvas');
      let drag = null;
      canvas.addEventListener('pointerdown', e => {
        if (photoFit !== 'cover' || !uploadedImages.length || !lastL) return;
        const r = canvas.getBoundingClientRect();
        const k = W / r.width;
        const x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
        if (y < lastL.fotoY || y > lastL.fotoY + FOTO_H) return;
        const cells = photoCells(uploadedImages.length);
        let idx = cells.findIndex(c => x >= c.x && x <= c.x + c.w);
        if (idx < 0) idx = x < W / 2 ? 0 : cells.length - 1; // klik di celah
        drag = { i: idx, x: e.clientX, y: e.clientY, k };
        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = 'grabbing';
        e.preventDefault();
      });
      canvas.addEventListener('pointermove', e => {
        if (!drag) return;
        const dx = (e.clientX - drag.x) * drag.k, dy = (e.clientY - drag.y) * drag.k;
        drag.x = e.clientX; drag.y = e.clientY;
        const info = coverInfo(uploadedImages[drag.i], cellOf(drag.i).w, FOTO_H);
        const f = focus[drag.i] || (focus[drag.i] = { x: 0.5, y: 0.5 });
        if (info.ox > 0.5) f.x = clamp01(f.x - dx / info.ox);
        if (info.oy > 0.5) f.y = clamp01(f.y - dy / info.oy);
        syncFocusUI();
        requestRender();
      });
      const end = () => { if (drag) { drag = null; canvas.style.cursor = 'grab'; } };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
    }

    // ---- download PNG HD (lebar 1950px) ----
    async function downloadImage(btn) {
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Memproses...';
      lucide.createIcons();
      try {
        await ensureFonts();
        const off = document.createElement('canvas');
        await drawFrame(off, getState(), 3, scratchCtx);
        const blob = await new Promise(res => off.toBlob(res, 'image/png'));
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Photoframe_${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (err) {
        console.error(err);
        alert('Gagal mengunduh gambar. Silakan coba lagi.');
      } finally {
        btn.innerHTML = original;
        btn.disabled = false;
        lucide.createIcons();
      }
    }

    // ---- Daftarkan Service Worker (hanya jalan di http/https, bukan file://) ----
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW gagal didaftarkan:', err));
      });
    }
  </script>
</body>
</html>
